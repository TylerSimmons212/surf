<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Styles demo</title>
<style>
  /* Layer order is declared up front: base loses to components. */
  @layer base, components;

  :root { --brand: #00aaff; --spacing: 8px; }

  body { font-family: serif; color: navy; display: block; }

  @layer base {
    .btn { padding: 20px; border-radius: 2px; }
  }
  @layer components {
    .btn { padding: 4px; }
  }

  /* Unlayered, so it beats every named layer despite being lighter. */
  .btn { border-radius: 12px; }

  .btn { color: red; }
  #main .btn { color: blue; }

  .card { margin: 8px; }
  .card { margin-top: 0; }

  .btn:hover { color: green; background: white; }
  .btn:focus-visible { outline: 3px dashed orange; }

  .btn { background: var(--brand); }

  .card { & .inner { color: teal; } }

  @media (min-width: 100px) {
    .btn { letter-spacing: 1px; }
  }

  @supports (display: grid) {
    .btn { text-transform: uppercase; }
  }

  .md\:flex { display: inline-flex; }

  /* Weightless by design — must never outrank anything. */
  :where(#main) .btn { font-weight: 900; }

  .btn::before { content: "→"; color: purple; }

  .stack .btn.wide { color: rebeccapurple !important; }
</style>
</head>
<body>
  <div id="main" class="stack">
    <div class="card">
      <button id="target" class="btn wide md:flex" style="letter-spacing: 4px">Press</button>
      <span class="inner">nested</span>
    </div>
  </div>
</body>
</html>

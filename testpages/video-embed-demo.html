<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Harbour Watch — Today's Stream</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; background: #eef1f2; }
    header { background: #123; color: #fff; padding: 12px 20px; }
    .layout { max-width: 900px; margin: 20px auto; padding: 0 16px; }
    iframe { width: 640px; height: 360px; border: 0; display: block; }
  </style>
</head>
<body>
  <header><strong>Harbour Watch</strong> — embeds, like the real web does it</header>
  <div class="layout">
    <!-- Served from a different port, so this is a genuinely cross-origin
         embed: the stage protocol has to hop the frame boundary by message,
         exactly as it must on a page embedding a third-party player. -->
    <iframe src="http://localhost:8932/video-demo.html" allow="autoplay"></iframe>
    <div>Today: water, in its usual direction.</div>
  </div>
</body>
</html>
